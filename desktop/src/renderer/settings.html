<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'" />
    <title>zerosoft</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff; --fg: #0d0d0d; --muted: #6b6b6b; --line: #e6e6e6; --field: #ffffff;
        --ok: #1f7a4d; --warn: #9a5b00; --accent: #0d0d0d; --accent-fg: #ffffff; --focus: #3b82f6;
      }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #111111; --fg: #f2f2f2; --muted: #9a9a9a; --line: #2a2a2a; --field: #181818; --ok: #4cc38a; --warn: #f5a524; --accent: #f2f2f2; --accent-fg: #0d0d0d; }
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
      main { max-width: 560px; margin: 0 auto; padding: 28px 24px 40px; }
      h1 { font-size: 20px; margin: 0 0 20px; font-weight: 600; }
      section { border-top: 1px solid var(--line); padding: 18px 0; }
      h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin: 0 0 12px; font-weight: 600; }
      label { display: block; font-weight: 500; margin-bottom: 6px; }
      .help { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
      input[type='text'], select { width: 100%; height: 34px; padding: 0 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--field); color: var(--fg); font: inherit; }
      input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
      .check { display: flex; gap: 10px; align-items: flex-start; font-weight: 400; margin: 6px 0; }
      .check input { margin-top: 3px; }
      .perm { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 10px 0; }
      .perm + .perm { border-top: 1px dashed var(--line); }
      .perm-name { font-weight: 500; }
      .perm-help { grid-column: 1 / -1; color: var(--muted); font-size: 13px; }
      .status { font-size: 12px; margin-left: 8px; }
      .status.granted { color: var(--ok); }
      .status.denied { color: var(--warn); }
      button { height: 32px; padding: 0 12px; border: 1px solid var(--line); border-radius: 4px; background: var(--field); color: var(--fg); font: inherit; cursor: pointer; }
      button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
      .row { display: flex; gap: 12px; align-items: center; justify-content: flex-end; padding-top: 18px; border-top: 1px solid var(--line); }
      .msg { color: var(--muted); font-size: 13px; margin-right: auto; }
      .msg.error { color: var(--warn); }
      kbd { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; border: 1px solid var(--line); border-radius: 3px; padding: 1px 5px; }
      [hidden] { display: none !important; }
      .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title"></h1>
      <form id="form" novalidate>
        <section id="perm-section" hidden>
          <h2 data-t="permissions"></h2>
          <div id="perms"></div>
          <p class="help" data-t="restartForPerms"></p>
        </section>
        <section>
          <h2 data-t="dictation"></h2>
          <label for="hotkey" data-t="holdKey"></label>
          <select id="hotkey"></select>
          <p class="help" data-t="holdHelp"></p>
          <p class="help"><span data-t="toggleKey"></span>: <kbd id="toggle"></kbd></p>
        </section>
        <section>
          <h2 data-t="meetings"></h2>
          <label class="check"><input type="checkbox" id="alerts" /> <span data-t="meetingAlerts"></span></label>
        </section>
        <section>
          <h2 data-t="general"></h2>
          <label class="check"><input type="checkbox" id="login" /> <span data-t="openAtLogin"></span></label>
        </section>
        <section>
          <h2 data-t="server"></h2>
          <label for="server" class="sr-only" data-t="server"></label>
          <input type="text" id="server" autocomplete="url" spellcheck="false" />
          <p class="help" data-t="serverHelp"></p>
        </section>
        <div class="row">
          <span class="msg" id="msg" role="status" aria-live="polite"></span>
          <button type="submit" class="primary" data-t="save"></button>
        </div>
      </form>
    </main>
    <script src="settings.js"></script>
  </body>
</html>
