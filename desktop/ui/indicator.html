<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>zerosoft recording</title>
    <style>
      /* Un rectángulo negro con un punto rojo que late (estilo Granola). La ventana mide lo mismo
         que el rectángulo: 44 × 28, y 96 × 28 con el mouse encima (indicator.rs, expand). */
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; -webkit-user-select: none; user-select: none; cursor: default; }
      body { font: 500 12px/1 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
      .chip {
        all: unset;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
        width: 100%;
        height: 100%;
        padding: 0 17px 0 10px;
        background: #0d0d0d;
        border: 1px solid #2e2e2e;
        border-radius: 3px;
        color: #f2f2f2;
        cursor: pointer;
      }
      body[data-on='false'] .chip { visibility: hidden; }
      .chip:focus-visible { outline: 2px solid #f2f2f2; outline-offset: -3px; }
      .clock { font-variant-numeric: tabular-nums; letter-spacing: 0.01em; color: #d6d6d6; white-space: nowrap; opacity: 0; transition: opacity 120ms ease-out; }
      body[data-open='true'] .clock { opacity: 1; }
      .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: #ff453a; box-shadow: 0 0 0 2px rgba(255, 69, 58, 0.18); animation: blink 2s ease-in-out infinite; }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.32; } }
      @media (prefers-reduced-motion: reduce) { .dot { animation: none; } .clock { transition: none; } }
    </style>
  </head>
  <body data-on="false" data-open="false">
    <button type="button" class="chip" id="chip">
      <span class="clock" id="clock" aria-hidden="true"></span>
      <span class="dot" aria-hidden="true"></span>
    </button>
    <script src="indicator.js"></script>
  </body>
</html>
