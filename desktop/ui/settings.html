<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>zerosoft</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff; --side: #f7f7f7; --fg: #0d0d0d; --muted: #6b6b6b; --line: #e6e6e6; --field: #ffffff; --hover: #f0f0f0; --selected: #e4e4e4; --selected-hover: #dcdcdc;
        --ok: #1f7a4d; --warn: #9a5b00; --err: #b42318; --accent: #0d0d0d; --accent-fg: #ffffff; --focus: #3b82f6; --chip: #f1f1f1;
      }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #111111; --side: #161616; --fg: #f2f2f2; --muted: #9a9a9a; --line: #2a2a2a; --field: #181818; --hover: #1f1f1f; --selected: #2a2a2a; --selected-hover: #323232; --ok: #4cc38a; --warn: #f5a524; --err: #ff6b5e; --accent: #f2f2f2; --accent-fg: #0d0d0d; --chip: #222222; }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; overflow-x: hidden; }
      .shell { display: grid; grid-template-columns: 208px minmax(0, 1fr); height: 100%; }
      /* Lista de secciones: búsqueda arriba, grupos con rótulo (la misma forma que la nav web embebida). */
      nav { background: var(--side); border-right: 1px solid var(--line); padding: 14px 8px 24px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
      .nav-search { width: 100%; min-height: 30px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 3px; background: var(--field); color: var(--fg); font: inherit; font-size: 13px; }
      .nav-search::placeholder { color: var(--muted); }
      .nav-list { display: flex; flex-direction: column; gap: 16px; }
      .nav-group { display: flex; flex-direction: column; gap: 1px; }
      .nav-heading { margin: 0; padding: 0 10px 3px; font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: 0.02em; }
      .nav-item { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 8px; min-height: 28px; padding: 4px 10px; border-radius: 3px; cursor: pointer; color: var(--fg); font-size: 13px; }
      .nav-item:hover { background: var(--hover); }
      .nav-item[aria-current='page'] { background: var(--selected); font-weight: 600; }
      .nav-item[aria-current='page']:hover { background: var(--selected-hover); }
      .nav-item:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
      .nav-item.busy { color: var(--muted); }
      .nav-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .nav-item .swatch { flex: 0 0 8px; width: 8px; height: 8px; border-radius: 2px; }
      .nav-item .count { margin-left: auto; font-size: 11px; color: var(--warn); font-variant-numeric: tabular-nums; }
      .nav-note { margin: 0; padding: 0 10px; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
      button.btn.link.inline { height: auto; padding: 0; color: var(--fg); text-decoration: underline; text-underline-offset: 2px; }
      main { overflow-y: auto; padding: 24px 28px 40px; min-width: 0; }
      .panel { max-width: 560px; }
      h1 { font-size: 20px; line-height: 1.3; margin: 0 0 4px; font-weight: 600; letter-spacing: -0.01em; }
      .lead { color: var(--muted); margin: 0 0 20px; }
      h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
      section { border-top: 1px solid var(--line); padding: 16px 0; }
      .lead + section { border-top: 0; padding-top: 0; }
      section { margin-top: 4px; }
      label.field { display: block; font-weight: 500; margin-bottom: 4px; }
      .help { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
      .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; }
      input[type='text'], select, textarea { width: 100%; min-height: 32px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--field); color: var(--fg); font: inherit; }
      textarea { min-height: 72px; resize: vertical; }
      select:disabled, input:disabled { opacity: 0.55; }
      :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
      .check { display: flex; gap: 10px; align-items: flex-start; font-weight: 400; margin: 8px 0; }
      .check input { margin-top: 3px; flex: none; }
      .radio { display: flex; gap: 10px; align-items: flex-start; margin: 6px 0; }
      .radio input { margin-top: 3px; flex: none; }
      button.btn { height: 30px; padding: 0 12px; border: 1px solid var(--line); border-radius: 4px; background: var(--field); color: var(--fg); font: inherit; font-size: 13px; cursor: pointer; white-space: nowrap; }
      button.btn:hover { background: var(--hover); }
      button.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
      button.btn.link { border-color: transparent; background: transparent; padding: 0 6px; color: var(--muted); }
      button.btn.link:hover { color: var(--fg); }
      button.btn:disabled { opacity: 0.5; cursor: default; }
      .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .spacer { flex: 1; }
      kbd { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 3px; padding: 0 5px; background: var(--chip); white-space: nowrap; }
      .notice { border: 1px solid color-mix(in srgb, var(--warn) 30%, var(--line)); background: color-mix(in srgb, var(--warn) 8%, var(--bg)); padding: 8px 12px; border-radius: 4px; font-size: 13px; margin: 10px 0; }
      .notice.error { border-color: color-mix(in srgb, var(--err) 35%, var(--line)); background: color-mix(in srgb, var(--err) 8%, var(--bg)); }
      .notice.info { border-color: color-mix(in srgb, var(--focus) 30%, var(--line)); background: color-mix(in srgb, var(--focus) 7%, var(--bg)); margin: 0 0 16px; }
      .step-note { display: block; margin-top: 6px; color: var(--fg); }
      .step-note.muted { color: var(--muted); }
      .status { font-size: 12px; color: var(--muted); }
      .status.error { color: var(--err); }
      .status.ok { color: var(--ok); }
      /* Primeros pasos */
      .steps { list-style: none; margin: 0; padding: 0; }
      .step { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 4px 12px; padding: 14px 0; border-top: 1px solid var(--line); align-items: start; }
      .step:first-child { border-top: 0; }
      .num { width: 22px; height: 22px; border: 1px solid var(--line); border-radius: 50%; display: grid; place-items: center; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
      .step.done .num { background: var(--ok); border-color: var(--ok); color: #fff; }
      .step-title { font-weight: 600; }
      .step-state { font-size: 12px; margin-left: 6px; font-weight: 400; }
      .step-state.ok { color: var(--ok); }
      .step-state.no { color: var(--warn); }
      .step-help { grid-column: 2 / -1; color: var(--muted); font-size: 13px; }
      .step-body { grid-column: 2 / -1; }
      .step .actions { display: flex; gap: 6px; }
      .step-row { margin-top: 10px; }
      .help.check-help { margin: -4px 0 0 23px; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; font-variant-numeric: tabular-nums; }
      .error-text { color: var(--err); }
      .update-banner { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 0 0 16px; }
      .update-banner span { flex: 1 1 220px; }
      /* Permisos */
      .perms .perm-title { font-weight: 600; }
      .perm-state { font-size: 12px; margin-left: 8px; }
      .perm-state.ok { color: var(--ok); }
      .perm-state.no { color: var(--warn); }
      .perm-state.muted { color: var(--muted); }
      .perms .item-text { -webkit-line-clamp: unset; display: block; }
      /* Reuniones: cómo se ve el indicador (cerrado y con el mouse encima). */
      .indicator-preview { display: flex; align-items: center; gap: 12px; margin: 12px 0 4px 23px; }
      .ind-chip { display: inline-flex; align-items: center; justify-content: flex-end; gap: 8px; box-sizing: border-box; width: 44px; height: 28px; padding: 0 16px 0 10px; background: #0d0d0d; border: 1px solid #2e2e2e; border-radius: 3px; }
      .ind-chip.open { width: 96px; }
      .ind-dot { width: 10px; height: 10px; border-radius: 50%; background: #ff453a; flex: none; }
      .ind-clock { font: 500 12px/1 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; color: #d6d6d6; font-variant-numeric: tabular-nums; }
      #latency { margin: 0 0 14px; }
      /* Privacidad y datos */
      .priv-used, .priv-src { display: block; margin-top: 4px; }
      .priv-src { font-size: 11px; }
      .priv-src button.btn.link.inline { font-size: 11px; color: var(--muted); }
      .priv-path { display: block; margin-top: 4px; font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--fg); overflow-wrap: anywhere; user-select: all; -webkit-user-select: all; }
      .priv-stores .item-text, .priv-network .item-text, .priv-events .item-text { -webkit-line-clamp: unset; display: block; }
      .priv-stores .item-actions, .perms .item-actions { flex-wrap: wrap; justify-content: flex-end; max-width: 220px; }
      .priv-events li { padding: 6px 12px; }
      .priv-plain { margin: 0; padding-left: 18px; }
      .priv-plain li { margin: 6px 0; }
      .priv-plain .priv-src { display: inline; }
      .priv-control { margin: 2px 0 10px; }
      .priv-confirm { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
      .priv-question { font-size: 12px; color: var(--err); flex-basis: 100%; text-align: right; }
      button.btn.danger { background: var(--err); border-color: var(--err); color: #fff; }
      button.btn.danger-outline { border-color: color-mix(in srgb, var(--err) 45%, var(--line)); color: var(--err); }
      #priv-delete-all .priv-confirm { justify-content: flex-start; }
      #priv-delete-all .priv-question { text-align: left; }
      /* Listas */
      .list { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 4px; }
      .list li { padding: 10px 12px; border-top: 1px solid var(--line); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: start; }
      .list li:first-child { border-top: 0; }
      .item-text { overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
      .item-meta { font-size: 12px; color: var(--muted); grid-column: 1; }
      .item-actions { grid-row: 1 / span 2; grid-column: 2; display: flex; gap: 4px; }
      .arrow { color: var(--muted); margin: 0 6px; }
      .tag { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; margin-left: 6px; }
      .empty, .loading { color: var(--muted); padding: 16px 0; }
      .add { display: grid; grid-template-columns: 130px minmax(0, 1fr) minmax(0, 1fr) auto; gap: 8px; align-items: end; margin-bottom: 14px; }
      .add[data-kind='word'] .only-replace { display: none; }
      .add[data-kind='word'] { grid-template-columns: 130px minmax(0, 1fr) auto; }
      [hidden] { display: none !important; }
      .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
      @media (max-width: 600px) {
        .shell { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
        nav { border-right: 0; border-bottom: 1px solid var(--line); padding: 10px 12px; max-height: 40vh; }
        main { padding: 18px 16px 32px; }
        .grid2, .add, .add[data-kind='word'] { grid-template-columns: minmax(0, 1fr); }
        .step { grid-template-columns: 24px minmax(0, 1fr); }
        .step .actions { grid-column: 2; }
        .list li { grid-template-columns: minmax(0, 1fr); }
        .item-actions { grid-row: auto; grid-column: 1; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <nav id="tabs" aria-label="Settings"></nav>
      <main id="main" tabindex="-1"></main>
    </div>
    <script src="settings.js"></script>
  </body>
</html>
