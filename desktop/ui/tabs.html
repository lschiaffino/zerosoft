<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>zerosoft tabs</title>
    <style>
      :root {
        color-scheme: light dark;
        --strip: #e8e8e8; --tab-hover: #dddddd; --tab-active: #ffffff; --fg: #1a1a1a; --muted: #6b6b6b; --line: #cfcfcf;
        --btn-hover: rgba(0, 0, 0, 0.07); --focus: #3b82f6; --dot: #2f6bff; --rec: #e5484d; --shadow: rgba(0, 0, 0, 0.08);
      }
      @media (prefers-color-scheme: dark) {
        :root { --strip: #1b1b1b; --tab-hover: #242424; --tab-active: #111111; --fg: #ececec; --muted: #8f8f8f; --line: #333333; --btn-hover: rgba(255, 255, 255, 0.08); --dot: #6b9bff; --rec: #ff6b5e; --shadow: rgba(0, 0, 0, 0.4); }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--strip); color: var(--fg); -webkit-user-select: none; user-select: none; cursor: default; }
      body { font: 12px/1 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
      .strip { display: flex; align-items: flex-end; height: 100%; padding: 0 6px 0 var(--lead, 8px); gap: 0; border-bottom: 1px solid var(--line); }
      body[data-platform='darwin'] { --lead: 80px; }
      body[data-platform='darwin'][data-fullscreen='true'] { --lead: 8px; }
      .tabs { display: flex; align-items: flex-end; min-width: 0; flex: 0 1 auto; height: 100%; position: relative; }
      .tab {
        position: relative; display: flex; align-items: center; gap: 7px; height: calc(100% - 6px); margin-bottom: -1px;
        flex: 0 1 200px; min-width: 44px; padding: 0 6px 0 10px; border-radius: 6px 6px 0 0; color: var(--muted);
        border: 1px solid transparent; border-bottom: 0; outline: none; transition: background-color 120ms ease;
      }
      .tab + .tab::before { content: ''; position: absolute; left: -1px; top: 9px; bottom: 9px; width: 1px; background: var(--line); }
      .tab:hover::before, .tab:hover + .tab::before, .tab[aria-selected='true']::before, .tab[aria-selected='true'] + .tab::before { opacity: 0; }
      .tab:hover { background: var(--tab-hover); color: var(--fg); }
      .tab[aria-selected='true'] { background: var(--tab-active); color: var(--fg); border-color: var(--line); z-index: 1; }
      .tab[aria-selected='true']::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--tab-active); }
      .tab:focus-visible { box-shadow: inset 0 0 0 2px var(--focus); }
      .tab.dragging { z-index: 3; box-shadow: 0 2px 10px var(--shadow); transition: none; background: var(--tab-active); color: var(--fg); }
      .tab.shift { transition: transform 150ms ease; }
      .icon { position: relative; flex: none; width: 16px; height: 16px; border-radius: 4px; display: grid; place-items: center; color: #fff; font: 700 9px/1 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; letter-spacing: -0.02em; }
      .icon.home { background: var(--fg); color: var(--strip); }
      .badge { position: absolute; top: -3px; right: -3px; width: 7px; height: 7px; border-radius: 50%; background: var(--dot); box-shadow: 0 0 0 1.5px var(--strip); }
      .tab[aria-selected='true'] .badge, .tab:hover .badge { box-shadow: 0 0 0 1.5px var(--tab-active); }
      .title { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; line-height: 16px; }
      .tab.asleep .title { opacity: 0.62; }
      .rec { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--rec); animation: pulse 1.6s ease-in-out infinite; }
      .close { flex: none; width: 18px; height: 18px; border: 0; padding: 0; border-radius: 4px; background: transparent; color: inherit; display: grid; place-items: center; opacity: 0; cursor: default; }
      .close svg { width: 8px; height: 8px; }
      .tab:hover .close, .tab[aria-selected='true'] .close, .close:focus-visible { opacity: 0.75; }
      .close:hover { opacity: 1; background: var(--btn-hover); }
      .close:focus-visible { outline: 2px solid var(--focus); outline-offset: -1px; }
      /* Angostas: solo el ícono (y la × en la de adelante). */
      .tab.narrow { padding: 0; justify-content: center; }
      .tab.narrow .title, .tab.narrow:not([aria-selected='true']) .close { display: none; }
      .tab.narrow[aria-selected='true'] .icon { display: none; }
      .new { flex: none; align-self: center; width: 26px; height: 26px; margin: 2px 0 0 4px; border: 0; border-radius: 5px; background: transparent; color: var(--muted); display: grid; place-items: center; }
      .new svg { width: 11px; height: 11px; }
      .new:hover { background: var(--btn-hover); color: var(--fg); }
      .new:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
      .fill { flex: 1; align-self: stretch; }
      @keyframes pulse { 50% { opacity: 0.35; } }
      @media (prefers-reduced-motion: reduce) { .rec { animation: none; } .tab, .tab.shift { transition: none; } }
    </style>
  </head>
  <body>
    <div class="strip" data-tauri-drag-region>
      <div class="tabs" id="tabs" role="tablist"></div>
      <button type="button" class="new" id="new">
        <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" /></svg>
      </button>
      <div class="fill" data-tauri-drag-region></div>
    </div>
    <script src="tabs.js"></script>
  </body>
</html>
