name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # 45: instalar ffmpeg por apt puede tardar más de 10 minutos y el build quedaba cortado a los 30.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # SPDX header on every ee/ file, and core only imports ee/lib/license.ts.
      - run: npx tsx scripts/check-ee-boundary.ts
      - run: npm run typecheck
      - run: npm run lint
      # ffmpeg: Rec arma el MP4 de descarga con él (lib/rec-mp4.ts); los tests lo verifican con ffprobe.
      - run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - run: npm test

  # ¿Hace falta e2e? No si el PR solo toca el desktop, el blog, la documentación o archivos .md.
  changes:
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.filter.outputs.skip != 'true' }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          predicate-quantifier: every
          filters: |
            skip:
              - 'desktop/**'
              - 'docs/**'
              - 'content/blog/**'
              - '**/*.md'

  # El build va aparte del chequeo: e2e lo necesita y no espera a typecheck, lint ni los unit tests.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXTAUTH_SECRET: ci-build-secret
          # El build de producción pasa los ~3,5 GB del heap por defecto (el runner tiene 16 GB).
          NODE_OPTIONS: --max-old-space-size=6144
      # En un tar: .next es una carpeta oculta y lleva symlinks, que el artifact no conserva sueltos.
      - run: tar -cf next-build.tar --exclude=.next/cache .next
      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: next-build.tar
          retention-days: 1
          compression-level: 1

  e2e:
    needs: [build, changes]
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: next-build
      - run: tar -xf next-build.tar && rm next-build.tar
      - run: npx playwright install --with-deps chromium
      # ffmpeg: Rec arma el MP4 de descarga con él (lib/rec-mp4.ts); los tests lo verifican con ffprobe.
      - run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      # Un worker por shard: los tests comparten el workspace demo de la base de cada corrida.
      # Partes repartidas por duración (scripts/e2e-shard.mjs con tests/e2e/timings.json), no por cantidad.
      - run: npx playwright test $(node scripts/e2e-shard.mjs ${{ matrix.shard }} 6)
        env:
          CI: 'true'
          E2E_SHARD: ${{ matrix.shard }}
      # La duración de cada test, para actualizar tests/e2e/timings.json (scripts/e2e-timings.mjs).
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: e2e-results-${{ matrix.shard }}
          path: e2e-results/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: ${{ !success() }}
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Sesiones reales: sin DEMO_MODE, cada rol entra con su código por email.
  e2e-real:
    needs: [build, changes]
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: next-build
      - run: tar -xf next-build.tar && rm next-build.tar
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:real
      - uses: actions/upload-artifact@v4
        if: ${{ !success() }}
        with:
          name: playwright-report-real
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build self-host image
        run: docker build -t zerosoft:ci .
      - name: Smoke test
        run: |
          docker run -d --name zs -p 3000:3000 \
            -e NEXTAUTH_SECRET=ci -e NEXTAUTH_URL=http://localhost:3000 zerosoft:ci
          for i in $(seq 1 30); do curl -sf http://localhost:3000/en >/dev/null && break; sleep 2; done
          curl -sf -o /dev/null -w "%{http_code}\n" http://localhost:3000/en
          docker logs zs | tail -20

  # Los e2e en cuarentena (tests/e2e/quarantine.json): corren y se reportan, pero no bloquean el merge
  # (no están en los needs de "CI result"). Los jobs e2e de arriba los saltean (playwright.config.ts).
  e2e-quarantine:
    needs: [build, changes]
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: next-build
      - run: tar -xf next-build.tar && rm next-build.tar
      - run: npx playwright install --with-deps chromium
      - run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - run: npx playwright test --pass-with-no-tests
        env:
          CI: 'true'
          E2E_QUARANTINE: only
      - uses: actions/upload-artifact@v4
        if: ${{ !success() }}
        with:
          name: playwright-report-quarantine
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Nombre estable para exigir un solo check, sea cual sea la cantidad de shards.
  ci-result:
    name: CI result
    needs: [check, changes, build, e2e, e2e-real, docker]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "check=${{ needs.check.result }} build=${{ needs.build.result }} e2e=${{ needs.e2e.result }} e2e-real=${{ needs.e2e-real.result }} docker=${{ needs.docker.result }} e2e-needed=${{ needs.changes.outputs.e2e }}"
          test "${{ needs.check.result }}" = success
          test "${{ needs.build.result }}" = success
          test "${{ needs.docker.result }}" = success
          if [ "${{ needs.changes.outputs.e2e }}" = "true" ]; then
            test "${{ needs.e2e.result }}" = success
            test "${{ needs.e2e-real.result }}" = success
          fi
