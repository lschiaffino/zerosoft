name: CI

# Un pull request corre solo lo que su cambio pide (job "changes", scripts/e2e-select.mjs): los e2e de las
# áreas que toca, en 1 a 3 partes, y sin e2e-real, cuarentena ni Docker salvo que toque lo suyo.
# Cada push a main y la corrida de cada noche corren todo: las 6 partes, e2e-real, cuarentena y Docker.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Todas las noches, 07:23 UTC.
    - cron: '23 7 * * *'
  workflow_dispatch:

# El token del job solo lee: los tests no escriben en el repo (y en los PR de forks nunca hay secretos).
permissions:
  contents: read
  # El job "changes" lee la lista de archivos del PR por la API.
  pull-requests: read

# En un PR, un push nuevo corta la corrida anterior. En main no: la corrida en curso termina y la más
# nueva espera su turno (antes cada merge cortaba la anterior y main no llegaba a probarse entero).
# La nocturna va en su propio grupo para que un merge no la desplace.
concurrency:
  group: ci-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    # 45: instalar ffmpeg por apt puede tardar más de 10 minutos y el build quedaba cortado a los 30.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # SPDX header on every ee/ file, and core only imports ee/lib/license.ts.
      - run: npx tsx scripts/check-ee-boundary.ts
      - run: npm run typecheck
        env:
          # tsc pasa el heap por defecto de Node con el tamaño actual del proyecto (el runner tiene 16 GB).
          NODE_OPTIONS: --max-old-space-size=6144
      - run: npm run lint
      # ffmpeg: Rec arma el MP4 de descarga con él (lib/rec-mp4.ts); los tests lo verifican con ffprobe.
      - run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - run: npm test

  # Qué pide este cambio (scripts/e2e-select.mjs con scripts/e2e-areas.json): qué specs de e2e y en cuántas
  # partes, y si hacen falta el build, e2e-real, la cuarentena y Docker. Fuera de un PR, todo.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      e2e: ${{ steps.plan.outputs.e2e }}
      build: ${{ steps.plan.outputs.build }}
      real: ${{ steps.plan.outputs.real }}
      quarantine: ${{ steps.plan.outputs.quarantine }}
      docker: ${{ steps.plan.outputs.docker }}
      shards: ${{ steps.plan.outputs.shards }}
      shard_total: ${{ steps.plan.outputs.shard_total }}
      specs: ${{ steps.plan.outputs.specs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          list="$RUNNER_TEMP/changed.txt"
          : > "$list"
          if [ "$EVENT" = pull_request ]; then
            # Si la API falla la lista queda vacía, y sin lista el script pide todo.
            gh api --paginate "repos/$REPO/pulls/$PR/files?per_page=100" \
              --jq '.[] | .filename, (.previous_filename // empty)' > "$list" || : > "$list"
          fi
          node scripts/e2e-select.mjs --event "$EVENT" --files "$list" >> "$GITHUB_OUTPUT"

  # El build va aparte del chequeo: e2e lo necesita y no espera a typecheck, lint ni los unit tests.
  build:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXTAUTH_SECRET: ci-build-secret
          # El build de producción pasa los ~3,5 GB del heap por defecto (el runner tiene 16 GB).
          NODE_OPTIONS: --max-old-space-size=6144
      # En un tar: .next es una carpeta oculta y lleva symlinks, que el artifact no conserva sueltos.
      - run: tar -cf next-build.tar --exclude=.next/cache .next
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: next-build
          path: next-build.tar
          retention-days: 1
          compression-level: 1

  e2e:
    needs: [build, changes]
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # [1] para una selección chica, hasta [1, 2, 3, 4, 5, 6] para la suite completa.
        shard: ${{ fromJSON(needs.changes.outputs.shards || '[1]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: next-build
      - run: tar -xf next-build.tar && rm next-build.tar
      - run: npx playwright install --with-deps chromium
      # ffmpeg: Rec arma el MP4 de descarga con él (lib/rec-mp4.ts); los tests lo verifican con ffprobe.
      - run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      # Un worker por shard: los tests comparten el workspace demo de la base de cada corrida.
      # Partes repartidas por duración (scripts/e2e-shard.mjs con tests/e2e/timings.json), no por cantidad.
      # E2E_SPECS es la selección del PR; vacío, la suite completa.
      - run: |
          files=$(node scripts/e2e-shard.mjs "$E2E_SHARD" "$E2E_SHARD_TOTAL")
          # Sin archivos, `playwright test` correría toda la suite en esta parte.
          test -n "$files"
          npx playwright test $files
        env:
          CI: 'true'
          E2E_SHARD: ${{ matrix.shard }}
          E2E_SHARD_TOTAL: ${{ needs.changes.outputs.shard_total }}
          E2E_SPECS: ${{ needs.changes.outputs.specs }}
      # La duración de cada test, para actualizar tests/e2e/timings.json (scripts/e2e-timings.mjs).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: e2e-results-${{ matrix.shard }}
          path: e2e-results/
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !success() }}
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Sesiones reales: sin DEMO_MODE, cada rol entra con su código por email.
  # En un PR, solo si toca sus specs o el código de sesión; en main y de noche, siempre.
  e2e-real:
    needs: [build, changes]
    if: needs.changes.outputs.real == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: next-build
      - run: tar -xf next-build.tar && rm next-build.tar
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:real
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !success() }}
        with:
          name: playwright-report-real
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # En un PR, solo si toca el Dockerfile o las dependencias; en main y de noche, siempre.
  docker:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build self-host image
        run: docker build -t zerosoft:ci .
      - name: Smoke test
        run: |
          docker run -d --name zs -p 3000:3000 \
            -e NEXTAUTH_SECRET=ci -e NEXTAUTH_URL=http://localhost:3000 zerosoft:ci
          for i in $(seq 1 30); do curl -sf http://localhost:3000/en >/dev/null && break; sleep 2; done
          curl -sf -o /dev/null -w "%{http_code}\n" http://localhost:3000/en
          docker logs zs | tail -20

  # Los e2e en cuarentena (tests/e2e/quarantine.json): corren y se reportan, pero no bloquean el merge
  # (no están en los needs de "CI result"). Los jobs e2e de arriba los saltean (playwright.config.ts).
  # En un PR, solo si toca la lista o un spec con tests en cuarentena; en main y de noche, siempre.
  e2e-quarantine:
    needs: [build, changes]
    if: needs.changes.outputs.quarantine == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: next-build
      - run: tar -xf next-build.tar && rm next-build.tar
      - run: npx playwright install --with-deps chromium
      - run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - run: npx playwright test --pass-with-no-tests
        env:
          CI: 'true'
          E2E_QUARANTINE: only
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !success() }}
        with:
          name: playwright-report-quarantine
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Nombre estable para exigir un solo check, sea cual sea la cantidad de partes.
  # Verde solo si cada job que el plan pidió terminó bien. Un job que el plan no pidió queda salteado y
  # cuenta como bien; uno fallado o cancelado, nunca.
  ci-result:
    name: CI result
    needs: [check, changes, build, e2e, e2e-real, docker]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          CHECK: ${{ needs.check.result }}
          CHANGES: ${{ needs.changes.result }}
          BUILD: ${{ needs.build.result }}
          E2E: ${{ needs.e2e.result }}
          REAL: ${{ needs.e2e-real.result }}
          DOCKER: ${{ needs.docker.result }}
          WANT_BUILD: ${{ needs.changes.outputs.build }}
          WANT_E2E: ${{ needs.changes.outputs.e2e }}
          WANT_REAL: ${{ needs.changes.outputs.real }}
          WANT_DOCKER: ${{ needs.changes.outputs.docker }}
        run: |
          echo "check=$CHECK changes=$CHANGES build=$BUILD($WANT_BUILD) e2e=$E2E($WANT_E2E) e2e-real=$REAL($WANT_REAL) docker=$DOCKER($WANT_DOCKER)"
          ok=0
          # gate <job> <resultado> <pedido>: pedido → success; no pedido → skipped (o success).
          gate() {
            if [ "$3" = true ]; then
              [ "$2" = success ] || { echo "::error::$1 hacía falta y terminó en '$2'"; ok=1; }
            elif [ "$3" = false ]; then
              [ "$2" = skipped ] || [ "$2" = success ] || { echo "::error::$1 terminó en '$2'"; ok=1; }
            else
              echo "::error::sin plan para $1 (el job changes no dejó su salida)"; ok=1
            fi
          }
          gate check "$CHECK" true
          gate changes "$CHANGES" true
          gate build "$BUILD" "$WANT_BUILD"
          gate e2e "$E2E" "$WANT_E2E"
          gate e2e-real "$REAL" "$WANT_REAL"
          gate docker "$DOCKER" "$WANT_DOCKER"
          exit $ok

  # main o la corrida nocturna en rojo: queda un issue abierto (uno solo, se actualiza con cada falla) y se
  # cierra solo cuando vuelve a pasar. Los PR no pasan por acá.
  main-status:
    name: Main status
    needs: ci-result
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (needs.ci-result.result == 'success' || needs.ci-result.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      # La lista de jobs de esta corrida, para nombrar los que fallaron.
      actions: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RESULT: ${{ needs.ci-result.result }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: 'CI: main is red'
        run: |
          issue=$(gh issue list -R "$REPO" --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          short=$(printf %s "$SHA" | cut -c1-9)
          if [ "$RESULT" = failure ]; then
            failed=$(gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
              --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out") | "- \(.name): \(.conclusion)"' || true)
            body=$(printf 'The full suite failed on `%s` (%s).\n\nRun: %s\n\n%s\n' "$short" "$EVENT" "$RUN_URL" "$failed")
            if [ -n "$issue" ]; then
              gh issue comment "$issue" -R "$REPO" --body "$body"
            else
              gh issue create -R "$REPO" --title "$TITLE" --body "$body"
            fi
          elif [ -n "$issue" ]; then
            gh issue close "$issue" -R "$REPO" --comment "Green again on \`$short\` ($EVENT). Run: $RUN_URL"
          fi
