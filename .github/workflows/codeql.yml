# Análisis estático (SAST) del código propio con CodeQL. Los hallazgos quedan en
# Security › Code scanning del repo, no en el log: no se publican detalles en el PR.
name: CodeQL

# Solo main y el semanal (decisión del dueño, 9 nov 2026): en cada PR ocupaba
# los runners que necesitan los tests.
# En main, solo cuando cambia código (no con contenido ni documentación).
on:
  push:
    branches: [main]
    paths-ignore:
      - 'content/**'
      - 'research/**'
      - 'docs/**'
      - '**/*.md'
  schedule:
    - cron: '17 6 * * 1'

# La corrida en curso termina y la más nueva espera: con un merge atrás de otro, cortarla dejaba main sin analizar.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          config: |
            paths-ignore:
              - tests
              - '**/*.test.ts'
              - desktop/src-tauri/target
      - uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          category: /language:${{ matrix.language }}
