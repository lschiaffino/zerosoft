# App de escritorio (desktop/, Tauri 2): instaladores de Mac (Apple silicon e Intel) y Windows en un
# release de GitHub.
#
# Se dispara con un tag desktop-vX.Y.Z (igual a la versión de desktop/package.json,
# src-tauri/tauri.conf.json y src-tauri/Cargo.toml). A mano (workflow_dispatch) arma todo como
# artefacto y no publica nada.
#
# Firma:
#   Mac: con MACOS_SIGNING_P12 + MACOS_SIGNING_P12_PASSWORD (un certificado propio, lo crea
#   desktop/scripts/macos-signing-cert.sh) la firma es estable: macOS mantiene Accesibilidad y el
#   micrófono entre versiones. Sin esos secretos, firma ad hoc (signingIdentity "-"): macOS ata los
#   permisos a cada build y después de cada actualización hay que volver a darlos.
#   Actualizaciones: TAURI_SIGNING_PRIVATE_KEY (+ TAURI_SIGNING_PRIVATE_KEY_PASSWORD si tiene)
#   firman los paquetes del updater; la clave pública va en src-tauri/tauri.conf.json. Sin el
#   secreto, los instaladores salen igual pero sin actualizaciones automáticas.
#
# Publicar: los builds no publican. Un solo job (publish) crea el release una vez, sube todo con
# nombres fijos (los que busca /download) y arma latest.json para el updater. Así no hay releases
# duplicados ni archivos de Mac perdidos.
name: desktop

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:
    inputs:
      signing_selftest:
        description: Firmar con un certificado descartable (prueba el camino de la firma estable sin los secretos)
        type: boolean
        default: false
  # En los PR que tocan el escritorio: tests y builds, sin publicar.
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: macos-15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:ui
      - name: Tests de Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            name: mac-arm64
            bundles: app,dmg
          - os: macos-15
            target: x86_64-apple-darwin
            name: mac-x64
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: win-x64
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: ${{ matrix.target }}

      - name: Versión del tag
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        working-directory: desktop
        run: |
          tag="${GITHUB_REF_NAME#desktop-v}"
          for v in "$(node -p "require('./package.json').version")" "$(node -p "require('./src-tauri/tauri.conf.json').version")" "$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)"; do
            if [ "$tag" != "$v" ]; then echo "El tag ($tag) no coincide con la versión del escritorio ($v)"; exit 1; fi
          done

      - run: npm ci
        working-directory: desktop

      - name: Clave del updater
        id: updater
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: echo "signed=$([ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      # NSIS para el instalador de Windows, en la carpeta donde lo busca tauri-bundler: así no lo
      # baja de releases de GitHub en pleno build (respondió 504 en desktop-v0.2.0).
      - name: NSIS en caché (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: ~/AppData/Local/tauri/NSIS
          key: tauri-nsis-3.13-utils-0.5.3

      - name: NSIS verificado (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./desktop/scripts/provision-nsis.ps1

      # Firma estable en Mac: el certificado de los secretos se importa en un llavero temporal y se
      # marca de confianza para firmar código (codesign no firma con un certificado sin confianza).
      # Tauri firma con APPLE_SIGNING_IDENTITY en vez de la firma ad hoc.
      - name: Certificado de firma (Mac)
        id: macsign
        if: runner.os == 'macOS'
        shell: bash
        env:
          P12: ${{ secrets.MACOS_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          SELFTEST: ${{ github.event_name == 'workflow_dispatch' && inputs.signing_selftest && 'yes' || 'no' }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/macsign"
          mkdir -p "$work"
          if [ -z "$P12" ] && [ "$SELFTEST" = "yes" ]; then
            P12_PASSWORD="$(openssl rand -hex 16)"
            printf '[req]\ndistinguished_name=dn\nprompt=no\nx509_extensions=ext\n[dn]\nCN=zerosoft desktop\n[ext]\nbasicConstraints=critical,CA:false\nkeyUsage=critical,digitalSignature\nextendedKeyUsage=critical,codeSigning\n' > "$work/cert.cnf"
            openssl req -x509 -newkey rsa:2048 -nodes -days 30 -keyout "$work/key.pem" -out "$work/cert.pem" -config "$work/cert.cnf" 2>/dev/null
            openssl pkcs12 -export -legacy -inkey "$work/key.pem" -in "$work/cert.pem" -name "zerosoft desktop" -out "$work/cert.p12" -passout "pass:$P12_PASSWORD" 2>/dev/null \
              || openssl pkcs12 -export -inkey "$work/key.pem" -in "$work/cert.pem" -name "zerosoft desktop" -out "$work/cert.p12" -passout "pass:$P12_PASSWORD"
            echo "Prueba: certificado descartable (este build no se publica)."
          elif [ -n "$P12" ]; then
            printf '%s' "$P12" | base64 --decode > "$work/cert.p12"
          else
            echo "Sin MACOS_SIGNING_P12: firma ad hoc (los permisos de macOS se piden de nuevo en cada versión)."
            echo "kind=adhoc" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          kc="$work/signing.keychain-db"
          kcpw="$(openssl rand -hex 16)"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security import "$work/cert.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security find-certificate -c "zerosoft desktop" -p "$kc" > "$work/cert.pem"
          rm -f "$work/cert.p12" "$work/key.pem"
          # Confianza para firmar código: en el dominio de administración y, si no deja, en el del usuario.
          sudo security authorizationdb write com.apple.trust-settings.admin allow || true
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k "$kc" "$work/cert.pem" \
            || security add-trusted-cert -r trustRoot -p codeSign -k "$kc" "$work/cert.pem" \
            || sudo security add-trusted-cert -r trustRoot -p codeSign -k "$kc" "$work/cert.pem" || true
          security find-identity -v -p codesigning "$kc" || true
          if ! security find-identity -v -p codesigning "$kc" | grep -q '1 valid identities found'; then
            if [ "$SELFTEST" = "yes" ]; then echo "::error::macOS no dejó confiar en el certificado"; exit 1; fi
            echo "::warning::macOS no dejó confiar en el certificado: este build sale con firma ad hoc."
            echo "kind=adhoc" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "APPLE_SIGNING_IDENTITY=zerosoft desktop" >> "$GITHUB_ENV"
          echo "kind=stable" >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v1
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tauriScript: npx tauri
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} ${{ steps.updater.outputs.signed != 'yes' && '--config src-tauri/tauri.no-updater.conf.json' || '' }}

      # Nombres fijos (los que busca /download) y tamaños en el resumen del job.
      - name: Archivos del release
        shell: bash
        working-directory: desktop
        run: |
          set -euo pipefail
          v="$(node -p "require('./package.json').version")"
          b="src-tauri/target/${{ matrix.target }}/release/bundle"
          mkdir -p out
          if [ "${{ runner.os }}" = "macOS" ]; then
            cp "$(ls "$b"/dmg/*.dmg | head -1)" "out/zerosoft-$v-${{ matrix.name }}.dmg"
            # El paquete del updater solo sirve firmado (sin TAURI_SIGNING_PRIVATE_KEY no hay .sig).
            if ls "$b"/macos/*.app.tar.gz.sig >/dev/null 2>&1; then
              cp "$(ls "$b"/macos/*.app.tar.gz | head -1)" "out/zerosoft-$v-${{ matrix.name }}.app.tar.gz"
              cp "$(ls "$b"/macos/*.app.tar.gz.sig | head -1)" "out/zerosoft-$v-${{ matrix.name }}.app.tar.gz.sig"
            fi
            app="$(ls -d "$b"/macos/*.app | head -1)"
            codesign -dv "$app" 2>&1 | grep -E "Signature|Identifier|TeamIdentifier" || true
            # Requisito designado: con el certificado tiene que nombrar el certificado, no un cdhash
            # (un cdhash cambia en cada build y macOS pierde los permisos).
            req="$(codesign -d -r- "$app" 2>&1 | grep 'designated =>' || true)"
            echo "$req"
            if [ "${{ steps.macsign.outputs.kind }}" = "stable" ] && ! echo "$req" | grep -Eq 'certificate (leaf|root) = H'; then
              echo "::error::La app no salió firmada con el certificado estable"; exit 1
            fi
            codesign -d --entitlements - "$app" 2>/dev/null | grep -E "device\.(camera|audio-input)" || { echo "::error::Faltan los permisos de cámara o micrófono"; exit 1; }
            plutil -extract NSCameraUsageDescription raw "$app/Contents/Info.plist" >/dev/null || { echo "::error::Falta NSCameraUsageDescription"; exit 1; }
            {
              echo "### ${{ matrix.name }}"
              echo "- .app: $(du -sh "$app" | cut -f1)"
              echo "- binario: $(du -h "$app/Contents/MacOS/"* | cut -f1 | head -1)"
              echo "- .dmg: $(du -h out/*.dmg | cut -f1)"
              echo "- firma: ${{ steps.macsign.outputs.kind || 'adhoc' }} ($req)"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            exe="$(ls "$b"/nsis/*-setup.exe | head -1)"
            cp "$exe" "out/zerosoft-$v-${{ matrix.name }}.exe"
            if [ -f "$exe.sig" ]; then cp "$exe.sig" "out/zerosoft-$v-${{ matrix.name }}.exe.sig"; fi
            {
              echo "### ${{ matrix.name }}"
              echo "- instalador: $(du -h out/*.exe | cut -f1)"
              echo "- binario: $(du -h src-tauri/target/${{ matrix.target }}/release/zerosoft*.exe | cut -f1 | head -1)"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          ls -la out

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.name }}
          path: desktop/out/*
          if-no-files-found: error

  # Un solo job publica: crea el release (si no existe), arma latest.json y sube todo pisando lo que
  # haya con el mismo nombre (volver a correr el workflow completa el release en vez de duplicarlo).
  # Publica lo que salió bien aunque falle una plataforma; "Re-run failed jobs" en esa corrida
  # rearma la que faltó y este job vuelve a subir todo (los artefactos de la corrida se conservan).
  publish:
    needs: build
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/desktop-v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: desktop/scripts
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: assets
          merge-multiple: true
      - name: Release con todos los archivos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          v="${TAG#desktop-v}"
          mkdir -p assets
          found=0
          for f in "zerosoft-$v-mac-arm64.dmg" "zerosoft-$v-mac-x64.dmg" "zerosoft-$v-win-x64.exe"; do
            if [ -f "assets/$f" ]; then found=$((found + 1)); else echo "::warning::Falta $f: re-correr el job que falló completa el release."; fi
          done
          [ "$found" -gt 0 ] || { echo "No salió ningún instalador"; exit 1; }
          # latest.json del updater, solo si los paquetes vienen firmados.
          node desktop/scripts/latest-json.mjs assets "$v" "https://github.com/$GH_REPO/releases/download/$TAG"
          ls -la assets
          count="$(gh api "repos/$GH_REPO/releases?per_page=100" --jq "[.[] | select(.tag_name == \"$TAG\")] | length")"
          if [ "$count" = "0" ]; then
            gh release create "$TAG" --verify-tag --title "zerosoft $v para escritorio" --notes "Instaladores de Mac (Apple silicon e Intel) y Windows. Descarga y notas: https://zerosoft.ai/download"
          elif [ "$count" != "1" ]; then
            echo "::warning::Hay $count releases con el tag $TAG: conviene borrar los duplicados."
          fi
          gh release upload "$TAG" assets/* --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name'
