name: CLA

# One-click CLA (CLA Assistant Lite). Signatures live in the cla-signatures
# branch, so main stays protected.
#
# Security: this runs on pull_request_target, with write access to the base
# repository. It never checks out or runs code from the pull request: it only
# reads the PR author list, posts comments, sets the status, and commits the
# signatures file. It uses no secret other than GITHUB_TOKEN.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened, closed]

permissions:
  actions: write
  contents: write # commit signatures to the cla-signatures branch
  pull-requests: write
  statuses: write

concurrency:
  # One signatures commit at a time.
  group: cla-signatures
  cancel-in-progress: false

jobs:
  cla:
    name: CLA
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - name: CLA Assistant Lite
        # contributor-assistant/github-action v2.6.1
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: lschiaffino,dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: >-
            Thanks for your pull request. Before we can merge it, please read our
            [Contributor License Agreement](https://github.com/${{ github.repository }}/blob/main/CLA.md)
            and sign it by posting the comment below. You keep the copyright in your work;
            the CLA grants us a license to use it. You only sign once.
