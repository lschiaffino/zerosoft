# Weekly dependency updates, grouped so each ecosystem opens one PR a week.
# rebase-strategy: disabled, because rebasing every open PR on each push to main
# reran their CI and kept the shared runners busy.
version: 2
updates:
  - package-ecosystem: npm
    # The web app and the desktop app's build tools (Tauri CLI, esbuild), each with its own lockfile.
    directories: ['/', '/desktop']
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    rebase-strategy: disabled
    labels: [dependencies]
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
      npm-major:
        update-types: [major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    rebase-strategy: disabled
    labels: [dependencies]
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: cargo
    # The desktop app (desktop/src-tauri, Tauri 2).
    directory: /desktop/src-tauri
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    rebase-strategy: disabled
    labels: [dependencies]
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
      cargo-major:
        update-types: [major]
