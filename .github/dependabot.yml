# Weekly dependency updates, grouped so each ecosystem opens one PR a week.
version: 2
updates:
  - package-ecosystem: npm
    # The web app and the desktop app's build tools (Tauri CLI, esbuild), each with its own lockfile.
    directories: ['/', '/desktop']
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
      npm-major:
        update-types: [major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: cargo
    # The desktop app (desktop/src-tauri, Tauri 2).
    directory: /desktop/src-tauri
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
