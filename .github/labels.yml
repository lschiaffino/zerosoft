# Repository labels. Synced to GitHub by .github/workflows/labels.yml on push to main.
# Labels that are not listed here are left alone.

# Type
- name: "bug"
  color: "#d73a4a"
  description: "Something isn't working"
- name: "enhancement"
  color: "#a2eeef"
  description: "New feature or request"
- name: "documentation"
  color: "#0075ca"
  description: "Docs, README or comments"
- name: "security"
  color: "#b60205"
  description: "Security hardening (report vulnerabilities privately, see SECURITY.md)"
- name: "i18n"
  color: "#c5def5"
  description: "Translations in en, es or pt"

# Contributors
- name: "good first issue"
  color: "#7057ff"
  description: "Small, well scoped, good for a first PR"
- name: "help wanted"
  color: "#008672"
  description: "We'd welcome a PR for this"
- name: "needs triage"
  color: "#ededed"
  description: "Not reviewed by a maintainer yet"
- name: "duplicate"
  color: "#cfd3d7"
  description: "Already reported"
- name: "wontfix"
  color: "#ffffff"
  description: "Out of scope for the project"

# Licensing
- name: "ee"
  color: "#000000"
  description: "Enterprise feature under ee/ (no outside PRs)"

# Size of the change
- name: "size:xs"
  color: "#e6f4ea"
  description: "Under an hour"
- name: "size:s"
  color: "#c2e6cb"
  description: "A few hours"
- name: "size:m"
  color: "#94d3a2"
  description: "About a day"
- name: "size:l"
  color: "#5cb874"
  description: "Several days; open an issue first"
- name: "size:xl"
  color: "#2e8b4a"
  description: "Large; needs a design discussion in an issue first"

